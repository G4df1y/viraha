name: Mobile preview

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/companion-core/**
      - pnpm-lock.yaml
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Test companion core
        run: pnpm --filter @viraha/companion-core test

      - name: Build companion core
        run: pnpm --filter @viraha/companion-core build

      - name: Test mobile app
        run: pnpm --filter @viraha/mobile test

      - name: Typecheck mobile app
        run: pnpm --filter @viraha/mobile typecheck

      - name: Export mobile app
        run: pnpm --filter @viraha/mobile export:android

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: viraha-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
