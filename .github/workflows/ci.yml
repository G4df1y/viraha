name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Test companion core
        run: pnpm --filter @viraha/companion-core test

      - name: Test mobile app
        run: pnpm --filter @viraha/mobile test

      - name: Typecheck mobile app
        run: pnpm --filter @viraha/mobile typecheck

      - name: Export mobile app
        run: pnpm --filter @viraha/mobile export:android

      - name: Reject Node.js imports in companion core
        shell: bash
        run: |
          if grep -R -n 'node:' packages/companion-core/src; then
            echo "Found a Node.js import in packages/companion-core/src; companion core must remain React Native compatible"
            exit 1
          fi

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Lint
        run: pnpm lint

      - name: Check for any type escapes
        shell: bash
        run: |
          if grep -r "as any" --include="*.ts" packages/; then
            echo "Found 'as any' usages in packages/; replace them with proper types"
            exit 1
          fi
